name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standards
        run: composer check-cs

      - name: Static analysis
        run: composer phpstan

      - name: Tests
        run: composer test

  assets:
    name: Control panel assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the committed build is up to date
        run: |
          if [ -n "$(git status --porcelain src/web/assets/cp/dist)" ]; then
            git status --porcelain src/web/assets/cp/dist
            echo "::error::src/web/assets/cp/dist is out of date. Run \`npm run build\` and commit the result."
            exit 1
          fi
