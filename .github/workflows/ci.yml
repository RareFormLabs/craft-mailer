name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: craft_mailer_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Coding standards
        run: composer check-cs

      - name: Static analysis
        run: composer phpstan

      - name: Unit tests
        run: composer test

      - name: Integration tests
        run: composer test-integration
        env:
          CRAFT_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=craft_mailer_test
          CRAFT_DB_USER: root
          CRAFT_DB_PASSWORD: root
          CRAFT_SECURITY_KEY: mailer-ci-security-key

  assets:
    name: Control panel assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check the committed build is up to date
        run: |
          if [ -n "$(git status --porcelain src/web/assets/cp/dist)" ]; then
            git status --porcelain src/web/assets/cp/dist
            echo "::error::src/web/assets/cp/dist is out of date. Run \`npm run build\` and commit the result."
            exit 1
          fi
